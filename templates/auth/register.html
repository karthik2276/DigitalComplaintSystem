{% extends 'base.html' %}

{% block title %}Register - Digital Complaint Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Create an Account</h2>
    <form method="POST" action="">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Create a strong password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Confirm your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">
        Already have an account? <a href="{{ url_for('main.login') }}" style="color: var(--primary-color);">Login here</a>
    </p>
</div>
{% endblock %}
