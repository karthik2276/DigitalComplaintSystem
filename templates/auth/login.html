{% extends 'base.html' %}

{% block title %}Login - Digital Complaint Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Welcome Back</h2>
    <form method="POST" action="">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
        </div>
        <div class="form-group" style="display: flex; align-items: center;">
            <input type="checkbox" id="remember" name="remember" style="margin-right: 0.5rem;">
            <label for="remember" style="margin-bottom: 0; font-weight: normal;">Remember Me</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">
        Don't have an account? <a href="{{ url_for('main.register') }}" style="color: var(--primary-color);">Register here</a>
    </p>
</div>
{% endblock %}
